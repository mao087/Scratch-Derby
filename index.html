<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WINNERS &amp; PAYOUT - Raffle pot Scratch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1008;
    --cream:#F5F0E8;
    --tan:#E8DFD0;
    --red:#8B1A1A;
    --green:#2D5A1B;
    --brown:#4A3828;
    --gray:#8a8a8a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    background-color:var(--cream);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(139,26,26,0.03) 0, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(26,16,8,0.04) 0, transparent 45%),
      repeating-linear-gradient(0deg, rgba(26,16,8,0.015) 0px, rgba(26,16,8,0.015) 1px, transparent 1px, transparent 3px);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .serif{font-family:'Shippori Mincho', serif;}
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    position:relative;
    background:var(--cream);
    box-shadow:0 0 40px rgba(0,0,0,0.08);
  }
  .screen{
    padding:20px 20px 32px;
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- ad container ---------- */
  .ad-container{
    width:100%;
    max-width:480px;
    text-align:center;
    padding:12px 0 24px;
    background:var(--cream);
    margin:0 auto;
  }
  .ad-container img{
    max-width:100%;
    height:auto;
  }

  /* ---------- header stamp ---------- */
  .header-wrap{ text-align:center; margin-bottom:8px; }
  .header-title{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:3px;
    color:var(--ink);
    display:inline-block;
    padding:0 6px;
  }
  .header-divider{ border:none; border-top:2px solid var(--ink); margin:8px 0 0; }
  .screen-title{
    font-family:'Shippori Mincho', serif;
    font-weight:700; font-size:16px; margin:8px 0 4px;
    text-align:left;
  }
  .thin-divider{ border:none; border-top:1px solid var(--ink); margin:0 0 12px; }

  /* ---------- buttons ---------- */
  .btn{
    width:100%; height:52px; border:none; border-radius:4px;
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:16px;
    cursor:pointer; letter-spacing:1px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-ink{ background:var(--ink); color:var(--cream); }
  .btn-brown{ background:var(--brown); color:var(--cream); }
  .btn-green{ background:var(--green); color:#fff; }
  .btn-red{ background:var(--red); color:#fff; }
  .btn-outline{
    background:transparent; border:1px solid var(--ink); color:var(--ink);
    height:44px; border-radius:4px; font-size:13px; width:100%; cursor:pointer;
  }
  .btn-small{ height:36px; font-size:12px; border-radius:8px; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; }

  /* ---------- setting row ---------- */
  .setting-row{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--ink); border-radius:4px;
    padding:8px 14px; margin-bottom:8px;
  }
  .setting-label{ font-weight:700; font-size:14px; }
  .stepper{ display:flex; align-items:center; gap:0; }
  .stepper button{
    width:34px; height:34px; border:none; border-radius:4px;
    background:var(--ink); color:var(--cream); font-weight:700; font-size:16px; cursor:pointer;
  }
  .stepper button:disabled{ background:#c9c2b6; cursor:not-allowed; }
  .stepper .val{ width:82px; text-align:center; font-size:15px; font-weight:800; }

  .info-box{
    border:1px solid var(--ink); border-radius:4px; background:var(--tan);
    padding:10px; font-size:11px; line-height:1.6; margin-bottom:8px; white-space:pre-line;
  }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--ink); border-radius:4px; padding:8px 14px; margin-bottom:8px;
  }
  .toggle-row .sub{ font-size:10px; color:#777; }
  .switch{ position:relative; width:42px; height:24px; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .track{
    position:absolute; inset:0; background:#c9c2b6; border-radius:24px; cursor:pointer; transition:.15s;
  }
  .switch .track::before{
    content:''; position:absolute; width:18px; height:18px; left:3px; top:3px;
    background:var(--cream); border-radius:50%; transition:.15s;
  }
  .switch input:checked + .track{ background:var(--red); }
  .switch input:checked + .track::before{ transform:translateX(18px); }
  .switch-label{ font-size:12px; margin-right:8px; }

  .advanced-box{ border:1px solid var(--red); border-radius:4px; padding:12px; margin-bottom:8px; }
  .advanced-box h4{ margin:0 0 10px; color:var(--red); font-size:13px; }
  .slider-label{ font-size:12px; margin-bottom:2px; }
  input[type=range]{ width:100%; accent-color:var(--red); margin-bottom:8px; }

  /* ---------- flow row / chips ---------- */
  .flow-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:10px 16px; border-radius:20px; border:1px solid var(--ink);
    background:var(--tan); color:var(--ink); font-size:14px; font-weight:700; cursor:pointer;
  }
  .chip.filled{ background:var(--ink); color:var(--cream); }
  .chip.selected{ background:var(--red); color:var(--cream); }

  .num-circle{
    width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; cursor:pointer; border:none; position:relative;
  }
  .num-circle.disabled{ opacity:0.5; cursor:not-allowed; }
  .num-circle.small{ width:36px; height:36px; font-size:13px; }

  /* ---------- player select grid ---------- */
  .player-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .player-card{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--ink); border-radius:8px; background:var(--tan);
    padding:14px 8px 14px 14px; cursor:pointer;
  }
  .player-card.selected{ background:var(--ink); color:var(--cream); }
  .player-card .name{ font-weight:700; font-size:15px; }
  .player-card button{
    background:none; border:none; cursor:pointer; font-size:16px; color:inherit; opacity:.6; line-height:1;
  }
  .input-row{ display:flex; align-items:center; gap:8px; margin-top:12px; }
  .input-row input{
    flex:1; border:1px solid var(--gray); border-radius:4px; padding:12px 10px;
    font-size:14px; background:transparent; color:var(--ink); font-family:inherit;
  }
  .input-row input:focus{ outline:none; border-color:var(--ink); }
  .icon-btn{
    width:46px; height:46px; border-radius:4px; background:var(--ink); color:var(--cream);
    border:none; font-size:20px; cursor:pointer; flex-shrink:0;
  }
  .error-text{ color:var(--red); font-size:12px; margin-top:8px; }

  /* ---------- assignment list ---------- */
  .assign-item{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--ink); border-radius:4px; padding:10px; margin-bottom:4px;
  }
  .assign-item .left{ display:flex; align-items:center; gap:6px; font-size:14px; }
  .dot{ width:10px; height:10px; border-radius:50%; border:0.5px solid var(--ink); display:inline-block; }
  .assign-item button{ background:none; border:none; color:var(--red); font-size:12px; cursor:pointer; }

  /* ---------- race card ---------- */
  .race-topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(26,16,8,0.92); color:var(--cream); padding:8px 14px;
    margin:-20px -20px 0; font-family:'Shippori Mincho', serif; font-weight:700; font-size:13px;
  }
  .race-topbar .right{ display:flex; align-items:center; gap:10px; font-size:16px; }
  .race-topbar .count{ font-size:10px; opacity:.7; font-family:'Zen Kaku Gothic New',sans-serif; }
  .reveal-row{ display:flex; gap:6px; margin:10px 0 4px; }
  .assign-strip{
    display:flex; justify-content:space-evenly; flex-wrap:wrap; gap:6px;
    border:1px solid var(--ink); border-radius:4px; background:rgba(245,240,232,0.9);
    padding:6px; margin-bottom:10px;
  }
  .assign-strip .item{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .assign-strip .box{
    width:28px; height:28px; border-radius:4px; border:1px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;
  }
  .assign-strip .pname{ font-size:9px; }

  .race-columns{ display:flex; gap:10px; align-items:flex-start; }
  .race-col{ flex:1; text-align:center; }
  .race-col h3{
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:16px; letter-spacing:4px; margin:0 0 6px;
  }
  .race-col .cells{
    border:1px solid var(--ink); border-radius:4px; background:rgba(245,240,232,0.85); padding:6px;
    display:flex; flex-direction:column; gap:4px;
  }
  .scratch-cell{
    position:relative; width:100%; height:48px; border:1.5px solid var(--ink); border-radius:2px;
    overflow:hidden; background:var(--cream); user-select:none;
  }
  .scratch-cell .value{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:20px; color:var(--ink);
  }
  .scratch-cell .value.small{ font-size:13px; }
  .scratch-cell canvas{ position:absolute; inset:0; width:100%; height:100%; cursor:pointer; touch-action:none; }
  .remaining-text{ color:rgba(26,16,8,0.6); font-size:11px; text-align:center; margin:16px 0 20px; }

  /* ---------- result screen ---------- */
  .result-row{ display:flex; align-items:center; padding:6px 4px; }
  .result-row.header{ font-weight:700; }
  .result-row.highlight{ background:var(--tan); }
  .r-col1{ width:44px; display:flex; align-items:center; gap:3px; font-size:13px; }
  .r-col2{ flex:1; font-size:13px; }
  .r-col3{ width:52px; text-align:center; font-size:13px; }
  .r-col4{ width:52px; text-align:right; font-size:13px; }
  .r-highlight{ color:var(--red); font-weight:700; }
  .row-divider{ border:none; border-top:0.5px solid rgba(26,16,8,0.3); margin:0; }

  /* ---------- toast / modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-box{
    background:var(--cream); border-radius:6px; padding:20px; max-width:340px; width:100%;
    border:1px solid var(--ink);
  }
  .modal-box h4{ margin:0 0 8px; font-size:15px; font-family:'Shippori Mincho', serif; }
  .modal-box p{ margin:0 0 16px; font-size:12px; color:#444; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:16px; }
  .modal-actions button{ background:none; border:none; font-size:13px; cursor:pointer; font-weight:700; }

  .finish-text{
    text-align:center; font-family:'Shippori Mincho', serif; font-weight:800; font-size:20px; color:var(--red);
    margin-bottom:14px;
  }
  ::-webkit-scrollbar{ width:0; height:0; }

  /* ---------- back (return) button ---------- */
  .back-btn{
    position:fixed;
    bottom:16px;
    left:max(12px, calc(50% - 240px + 12px));
    width:44px; height:44px; border-radius:50%;
    background:rgba(26,16,8,0.85); color:#F5F0E8; border:none;
    font-size:19px; cursor:pointer; z-index:50;
    box-shadow:0 3px 10px rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .back-btn:active{ transform:scale(0.92); }

  /* ---------- settings shortcut button ---------- */
  .settings-btn{
    position:fixed;
    bottom:16px;
    right:max(12px, calc(50% - 240px + 12px));
    width:44px; height:44px; border-radius:50%;
    background:rgba(139,26,26,0.88); color:#F5F0E8; border:none;
    font-size:19px; cursor:pointer; z-index:50;
    box-shadow:0 3px 10px rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .settings-btn:active{ transform:scale(0.92); }
</style>
</head>
<body>
<div id="app"></div>

<!-- 広告エリア -->
<div class="ad-container">
  <a href="https://px.a8.net/svt/ejp?a8mat=4BA41A+1823JM+3A98+669JL" rel="nofollow">
  <img border="0" width="468" height="60" alt="" src="https://www26.a8.net/svt/bgt?aid=260812270074&wid=001&eno=01&mid=s00000015326001037000&mc=1"></a>
  <img border="0" width="1" height="1" src="https://www13.a8.net/0.gif?a8mat=4BA41A+1823JM+3A98+669JL" alt="">
</div>

<script>
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function hexLuminance(hex){
  if(!hex) return 0;
  const c = hex.replace('#','');
  const r = parseInt(c.substring(0,2),16)/255;
  const g = parseInt(c.substring(2,4),16)/255;
  const b = parseInt(c.substring(4,6),16)/255;
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function textColorFor(hex){ return hexLuminance(hex) > 0.55 ? '#000000' : '#F5F0E8'; }
function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

function fullyRandomOdds(total, count){
  const result = new Array(count).fill(0);
  let remaining = total;
  const order = shuffle([...Array(count).keys()]);
  for(let i = 0; i < count - 1; i++){
    const give = randInt(0, remaining);
    result[order[i]] = give;
    remaining -= give;
  }
  result[order[count-1]] = Math.max(remaining, 0);
  return result;
}
function generateOdds(total, count, minGuaranteeProb, jackpotProb){
  if(count === 0) return [];
  const roll = randInt(1, 100);
  if(roll <= jackpotProb){
    const result = new Array(count).fill(0);
    result[randInt(0, count-1)] = total;
    return result;
  } else if(roll <= jackpotProb + minGuaranteeProb){
    if(total < count) return fullyRandomOdds(total, count);
    const result = new Array(count).fill(1);
    let remaining = total - count;
    const order = shuffle([...Array(count).keys()]);
    for(let i = 0; i < count - 1; i++){
      const give = randInt(0, remaining);
      result[order[i]] += give;
      remaining -= give;
    }
    result[order[count-1]] += Math.max(remaining, 0);
    return result;
  } else {
    return fullyRandomOdds(total, count);
  }
}
function generateRaceCard(settings){
  const n = settings.playerCount;
  const w = settings.winnerCount;
  const winnerNumbers = shuffle([...Array(n).keys()].map(i => i+1)).slice(0, w);
  const odds = generateOdds(n, w, settings.minGuaranteeProbability, settings.jackpotProbability);
  const cells = [];
  winnerNumbers.forEach((num, i) => {
    cells.push({ id: 'w_'+i+'_'+uid(), isWinner: true, rowIndex: i, hiddenValue: String(num), isScratched: false });
    const o = odds[i];
    cells.push({ id: 'o_'+i+'_'+uid(), isWinner: false, rowIndex: i, hiddenValue: o === 0 ? '0' : (o + '/' + n), isScratched: false });
  });
  return { cells, denominator: n };
}
function winnerCells(card){ return card.cells.filter(c => c.isWinner).sort((a,b) => a.rowIndex - b.rowIndex); }
function oddsCells(card){ return card.cells.filter(c => !c.isWinner).sort((a,b) => a.rowIndex - b.rowIndex); }

function calcResults(assignments, card, betPoints){
  const n = card.denominator;
  const wc = winnerCells(card), oc = oddsCells(card);
  const results = assignments.map(a => {
    const win = wc.find(c => c.hiddenValue === String(a.number));
    if(win){
      const oddsCell = oc.find(c => c.rowIndex === win.rowIndex);
      const oddsStr = oddsCell ? oddsCell.hiddenValue : '0';
      const numerator = oddsStr === '0' ? 0 : parseInt(oddsStr.split('/')[0], 10);
      return { playerName: a.playerName, number: a.number, isWinner: true, oddsNumerator: numerator, denominator: n, score: numerator * betPoints };
    }
    return { playerName: a.playerName, number: a.number, isWinner: false, oddsNumerator: 0, denominator: n, score: 0 };
  });
  results.sort((a,b) => b.score - a.score);
  return results;
}

let state = {
  settings: {
    mode: 'FULL', playerCount: 8, winnerCount: 3, setCount: 10, roundsPerSet: 30,
    betPoints: 1, soundEnabled: true, minGuaranteeProbability: 80, jackpotProbability: 5,
    allowDuplicateNumbers: false, oddsDisplayMode: 'number',
    scratchMemberSelect: false
  },
  savedPlayers: [],
  activePlayerIds: [],
  assignments: [],
  currentSet: 1,
  currentRound: 1,
  currentCard: null,
  history: [],
  scratchOnlyHistory: [],
  numberColors: {},
  isInProgress: false
};
let screen = 'settings';

const app = document.getElementById('app');
function h(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if(k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => { if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}

function renderSettingsScreen(){
  const wrap = h('div', {class:'screen'});
  wrap.appendChild(h('div', {class:'header-wrap'}, [
    h('div', {class:'header-title serif'}, ['WINNERS & PAYOUT']),
    h('hr', {class:'header-divider'})
  ]));
  wrap.appendChild(h('div', {class:'screen-title'}, ['基本設定']));
  wrap.appendChild(h('hr', {class:'thin-divider'}));

  const startBtn = h('button', {
    class: 'btn btn-red',
    onclick: () => {
      alert('ゲーム機能の読み込みが完了しました！');
    }
  }, ['ゲームを開始する']);
  wrap.appendChild(startBtn);

  return wrap;
}

function render(){
  app.innerHTML = '';
  app.appendChild(renderSettingsScreen());
}
render();
</script>
</body>
</html>

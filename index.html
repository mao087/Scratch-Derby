<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WINNERS &amp; PAYOUT - KamiKeiba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1008;
    --cream:#F5F0E8;
    --tan:#E8DFD0;
    --red:#8B1A1A;
    --green:#2D5A1B;
    --brown:#4A3828;
    --gray:#8a8a8a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    background-color:var(--cream);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .serif{font-family:'Shippori Mincho', serif;}
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    position:relative;
    background:var(--cream);
    box-shadow:0 0 40px rgba(0,0,0,0.08);
  }
  .screen{
    padding:20px 20px 32px;
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- ad container ---------- */
  .ad-container{
    width:100%;
    max-width:480px;
    text-align:center;
    padding:12px 0 24px;
    background:var(--cream);
    margin:0 auto;
  }
  .ad-container img{
    max-width:100%;
    height:auto;
  }

  /* ---------- header ---------- */
  .header-wrap{ text-align:center; margin-bottom:16px; }
  .header-title{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:3px;
    color:var(--ink);
    display:inline-block;
  }
  .header-divider{ border:none; border-top:2px solid var(--ink); margin:8px 0 0; }
  .screen-title{
    font-family:'Shippori Mincho', serif;
    font-weight:700; font-size:16px; margin:12px 0 4px;
    text-align:left;
  }
  .thin-divider{ border:none; border-top:1px solid var(--ink); margin:0 0 16px; }

  /* ---------- buttons ---------- */
  .btn{
    width:100%; height:52px; border:none; border-radius:4px;
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:16px;
    cursor:pointer; letter-spacing:1px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:12px;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-red{ background:var(--red); color:#fff; }
  .btn-ink{ background:var(--ink); color:var(--cream); }

  /* ---------- setting row ---------- */
  .setting-row{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--ink); border-radius:4px;
    padding:10px 14px; margin-bottom:12px;
    background:var(--tan);
  }
  .setting-label{ font-weight:700; font-size:14px; }
  .stepper{ display:flex; align-items:center; gap:0; }
  .stepper button{
    width:34px; height:34px; border:none; border-radius:4px;
    background:var(--ink); color:var(--cream); font-weight:700; font-size:16px; cursor:pointer;
  }
  .stepper .val{ width:60px; text-align:center; font-size:15px; font-weight:800; }

  /* ---------- race columns & scratch ---------- */
  .race-columns{ display:flex; gap:12px; align-items:flex-start; margin-top:16px; }
  .race-col{ flex:1; text-align:center; }
  .race-col h3{ font-family:'Shippori Mincho', serif; font-weight:700; font-size:16px; margin:0 0 8px; }
  .race-col .cells{ display:flex; flex-direction:column; gap:8px; }
  
  .scratch-cell{
    position:relative; width:100%; height:50px; border:1.5px solid var(--ink); border-radius:4px;
    overflow:hidden; background:var(--cream); user-select:none;
  }
  .scratch-cell .value{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:20px; color:var(--ink);
  }
  .scratch-cell canvas{ position:absolute; inset:0; width:100%; height:100%; cursor:pointer; touch-action:none; }
</style>
</head>
<body>
<div id="app"></div>

<!-- A8.net 広告エリア -->
<div class="ad-container">
  <a href="https://px.a8.net/svt/ejp?a8mat=4BA41A+1823JM+3A98+669JL" rel="nofollow">
  <img border="0" width="468" height="60" alt="" src="https://www26.a8.net/svt/bgt?aid=260812270074&wid=001&eno=01&mid=s00000015326001037000&mc=1"></a>
  <img border="0" width="1" height="1" src="https://www13.a8.net/0.gif?a8mat=4BA41A+1823JM+3A98+669JL" alt="">
</div>

<script>
let state = {
  screen: 'settings', // 'settings' | 'game'
  playerCount: 8,
  winnerCount: 3,
  card: null
};

function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateCard(pCount, wCount){
  const winnerNums = shuffle([...Array(pCount).keys()].map(i => i + 1)).slice(0, wCount);
  const winners = winnerNums.map((num, idx) => ({ id: 'w_' + idx, value: String(num) }));
  const odds = winnerNums.map((_, idx) => ({ id: 'o_' + idx, value: String(randInt(1, pCount)) }));
  return { winners, odds };
}

const app = document.getElementById('app');

function h(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if(k === 'style') e.style.cssText = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => { if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}

// スクラッチキャンバスのセットアップ
function setupCanvas(canvas){
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width || 180;
  canvas.height = rect.height || 50;

  // 削る前のアッシュ色塗料
  ctx.fillStyle = '#A0988E';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#6E665C';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('SCRATCH', canvas.width / 2, canvas.height / 2);

  let isDrawing = false;
  function scratch(e){
    if(!isDrawing) return;
    const r = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    const x = touch.clientX - r.left;
    const y = touch.clientY - r.top;

    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.fill();
  }

  canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
  canvas.addEventListener('mousemove', scratch);
  window.addEventListener('mouseup', () => { isDrawing = false; });

  canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, {passive:true});
  canvas.addEventListener('touchmove', scratch, {passive:true});
  canvas.addEventListener('touchend', () => { isDrawing = false; });
}

function renderSettingsScreen(){
  const wrap = h('div', {class:'screen'});
  wrap.appendChild(h('div', {class:'header-wrap'}, [
    h('div', {class:'header-title serif'}, ['WINNERS & PAYOUT']),
    h('hr', {class:'header-divider'})
  ]));
  
  wrap.appendChild(h('div', {class:'screen-title'}, ['基本設定']));
  wrap.appendChild(h('hr', {class:'thin-divider'}));

  // 参加人数
  wrap.appendChild(h('div', {class:'setting-row'}, [
    h('span', {class:'setting-label'}, ['参加人数']),
    h('div', {class:'stepper'}, [
      h('button', {onclick: () => { if(state.playerCount > 2){ state.playerCount--; render(); } }}, ['-']),
      h('span', {class:'val'}, [state.playerCount + ' 人']),
      h('button', {onclick: () => { if(state.playerCount < 24){ state.playerCount++; render(); } }}, ['+'])
    ])
  ]));

  // 的中枠数
  wrap.appendChild(h('div', {class:'setting-row'}, [
    h('span', {class:'setting-label'}, ['的中枠数']),
    h('div', {class:'stepper'}, [
      h('button', {onclick: () => { if(state.winnerCount > 1){ state.winnerCount--; render(); } }}, ['-']),
      h('span', {class:'val'}, [state.winnerCount + ' 枠']),
      h('button', {onclick: () => { if(state.winnerCount < state.playerCount){ state.winnerCount++; render(); } }}, ['+'])
    ])
  ]));

  // 開始ボタン
  wrap.appendChild(h('button', {
    class: 'btn btn-red',
    style: 'margin-top: 24px;',
    onclick: () => {
      state.card = generateCard(state.playerCount, state.winnerCount);
      state.screen = 'game';
      render();
    }
  }, ['ゲームを開始する']));

  return wrap;
}

function renderGameScreen(){
  const wrap = h('div', {class:'screen'});
  wrap.appendChild(h('div', {class:'header-wrap'}, [
    h('div', {class:'header-title serif'}, ['スクラッチ']),
    h('hr', {class:'header-divider'})
  ]));

  const cols = h('div', {class:'race-columns'});

  // 着順（当たり番）列
  const winCol = h('div', {class:'race-col'}, [h('h3', {}, ['的中馬番'])]);
  const winCells = h('div', {class:'cells'});
  state.card.winners.forEach(w => {
    const cell = h('div', {class:'scratch-cell'}, [
      h('div', {class:'value'}, [w.value]),
      h('canvas', {})
    ]);
    winCells.appendChild(cell);
  });
  winCol.appendChild(winCells);

  // オッズ列
  const oddsCol = h('div', {class:'race-col'}, [h('h3', {}, ['倍率'])]);
  const oddsCells = h('div', {class:'cells'});
  state.card.odds.forEach(o => {
    const cell = h('div', {class:'scratch-cell'}, [
      h('div', {class:'value'}, [o.value + '倍']),
      h('canvas', {})
    ]);
    oddsCells.appendChild(cell);
  });
  oddsCol.appendChild(oddsCells);

  cols.appendChild(winCol);
  cols.appendChild(oddsCol);
  wrap.appendChild(cols);

  // 設定へ戻るボタン
  wrap.appendChild(h('button', {
    class: 'btn btn-ink',
    style: 'margin-top: 32px;',
    onclick: () => {
      state.screen = 'settings';
      render();
    }
  }, ['設定に戻る']));

  return wrap;
}

function render(){
  app.innerHTML = '';
  if(state.screen === 'settings'){
    app.appendChild(renderSettingsScreen());
  } else {
    app.appendChild(renderGameScreen());
    // キャンバスの初期化（レンダリング後）
    setTimeout(() => {
      document.querySelectorAll('canvas').forEach(setupCanvas);
    }, 50);
  }
}

render();
</script>
</body>
</html>

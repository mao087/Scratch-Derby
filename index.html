<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WINNERS &amp; PAYOUT - カミケバ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1008;
    --cream:#F5F0E8;
    --tan:#E8DFD0;
    --red:#8B1A1A;
    --green:#2D5A1B;
    --brown:#4A3828;
    --gray:#8a8a8a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    background-color:var(--cream);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(139,26,26,0.03) 0, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(26,16,8,0.04) 0, transparent 45%),
      repeating-linear-gradient(0deg, rgba(26,16,8,0.015) 0px, rgba(26,16,8,0.015) 1px, transparent 1px, transparent 3px);
    min-height:100%;
    display:flex;
    justify-content:center;
  }
  .serif{font-family:'Shippori Mincho', serif;}
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    position:relative;
    background:var(--cream);
    box-shadow:0 0 40px rgba(0,0,0,0.08);
  }
  .screen{
    padding:20px 20px 32px;
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- header stamp ---------- */
  .header-wrap{ text-align:center; margin-bottom:8px; }
  .header-title{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:3px;
    color:var(--ink);
    display:inline-block;
    padding:0 6px;
  }
  .header-divider{ border:none; border-top:2px solid var(--ink); margin:8px 0 0; }
  .screen-title{
    font-family:'Shippori Mincho', serif;
    font-weight:700; font-size:16px; margin:8px 0 4px;
    text-align:left;
  }
  .thin-divider{ border:none; border-top:1px solid var(--ink); margin:0 0 12px; }

  /* ---------- buttons ---------- */
  .btn{
    width:100%; height:52px; border:none; border-radius:4px;
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:16px;
    cursor:pointer; letter-spacing:1px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-ink{ background:var(--ink); color:var(--cream); }
  .btn-brown{ background:var(--brown); color:var(--cream); }
  .btn-green{ background:var(--green); color:#fff; }
  .btn-red{ background:var(--red); color:#fff; }
  .btn-outline{
    background:transparent; border:1px solid var(--ink); color:var(--ink);
    height:44px; border-radius:4px; font-size:13px; width:100%; cursor:pointer;
  }
  .btn-small{ height:36px; font-size:12px; border-radius:8px; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; }

  /* ---------- setting row ---------- */
  .setting-row{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--ink); border-radius:4px;
    padding:8px 14px; margin-bottom:8px;
  }
  .setting-label{ font-weight:700; font-size:14px; }
  .stepper{ display:flex; align-items:center; gap:0; }
  .stepper button{
    width:34px; height:34px; border:none; border-radius:4px;
    background:var(--ink); color:var(--cream); font-weight:700; font-size:16px; cursor:pointer;
  }
  .stepper button:disabled{ background:#c9c2b6; cursor:not-allowed; }
  .stepper .val{ width:82px; text-align:center; font-size:15px; font-weight:800; }

  .info-box{
    border:1px solid var(--ink); border-radius:4px; background:var(--tan);
    padding:10px; font-size:11px; line-height:1.6; margin-bottom:8px; white-space:pre-line;
  }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--ink); border-radius:4px; padding:8px 14px; margin-bottom:8px;
  }
  .toggle-row .sub{ font-size:10px; color:#777; }
  .switch{ position:relative; width:42px; height:24px; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .track{
    position:absolute; inset:0; background:#c9c2b6; border-radius:24px; cursor:pointer; transition:.15s;
  }
  .switch .track::before{
    content:''; position:absolute; width:18px; height:18px; left:3px; top:3px;
    background:var(--cream); border-radius:50%; transition:.15s;
  }
  .switch input:checked + .track{ background:var(--red); }
  .switch input:checked + .track::before{ transform:translateX(18px); }
  .switch-label{ font-size:12px; margin-right:8px; }

  .advanced-box{ border:1px solid var(--red); border-radius:4px; padding:12px; margin-bottom:8px; }
  .advanced-box h4{ margin:0 0 10px; color:var(--red); font-size:13px; }
  .slider-label{ font-size:12px; margin-bottom:2px; }
  input[type=range]{ width:100%; accent-color:var(--red); margin-bottom:8px; }

  /* ---------- flow row / chips ---------- */
  .flow-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:10px 16px; border-radius:20px; border:1px solid var(--ink);
    background:var(--tan); color:var(--ink); font-size:14px; font-weight:700; cursor:pointer;
  }
  .chip.filled{ background:var(--ink); color:var(--cream); }
  .chip.selected{ background:var(--red); color:var(--cream); }

  .num-circle{
    width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; cursor:pointer; border:none; position:relative;
  }
  .num-circle.disabled{ opacity:0.5; cursor:not-allowed; }
  .num-circle.small{ width:36px; height:36px; font-size:13px; }

  /* ---------- player select grid ---------- */
  .player-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .player-card{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--ink); border-radius:8px; background:var(--tan);
    padding:14px 8px 14px 14px; cursor:pointer;
  }
  .player-card.selected{ background:var(--ink); color:var(--cream); }
  .player-card .name{ font-weight:700; font-size:15px; }
  .player-card button{
    background:none; border:none; cursor:pointer; font-size:16px; color:inherit; opacity:.6; line-height:1;
  }
  .input-row{ display:flex; align-items:center; gap:8px; margin-top:12px; }
  .input-row input{
    flex:1; border:1px solid var(--gray); border-radius:4px; padding:12px 10px;
    font-size:14px; background:transparent; color:var(--ink); font-family:inherit;
  }
  .input-row input:focus{ outline:none; border-color:var(--ink); }
  .icon-btn{
    width:46px; height:46px; border-radius:4px; background:var(--ink); color:var(--cream);
    border:none; font-size:20px; cursor:pointer; flex-shrink:0;
  }
  .error-text{ color:var(--red); font-size:12px; margin-top:8px; }

  /* ---------- assignment list ---------- */
  .assign-item{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--ink); border-radius:4px; padding:10px; margin-bottom:4px;
  }
  .assign-item .left{ display:flex; align-items:center; gap:6px; font-size:14px; }
  .dot{ width:10px; height:10px; border-radius:50%; border:0.5px solid var(--ink); display:inline-block; }
  .assign-item button{ background:none; border:none; color:var(--red); font-size:12px; cursor:pointer; }

  /* ---------- race card ---------- */
  .race-topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(26,16,8,0.92); color:var(--cream); padding:8px 14px;
    margin:-20px -20px 0; font-family:'Shippori Mincho', serif; font-weight:700; font-size:13px;
  }
  .race-topbar .right{ display:flex; align-items:center; gap:10px; font-size:16px; }
  .race-topbar .count{ font-size:10px; opacity:.7; font-family:'Zen Kaku Gothic New',sans-serif; }
  .reveal-row{ display:flex; gap:6px; margin:10px 0 4px; }
  .assign-strip{
    display:flex; justify-content:space-evenly; flex-wrap:wrap; gap:6px;
    border:1px solid var(--ink); border-radius:4px; background:rgba(245,240,232,0.9);
    padding:6px; margin-bottom:10px;
  }
  .assign-strip .item{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .assign-strip .box{
    width:28px; height:28px; border-radius:4px; border:1px solid var(--ink);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px;
  }
  .assign-strip .pname{ font-size:9px; }

  .race-columns{ display:flex; gap:10px; align-items:flex-start; }
  .race-col{ flex:1; text-align:center; }
  .race-col h3{
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:16px; letter-spacing:4px; margin:0 0 6px;
  }
  .race-col .cells{
    border:1px solid var(--ink); border-radius:4px; background:rgba(245,240,232,0.85); padding:6px;
    display:flex; flex-direction:column; gap:4px;
  }
  .scratch-cell{
    position:relative; width:100%; height:48px; border:1.5px solid var(--ink); border-radius:2px;
    overflow:hidden; background:var(--cream); user-select:none;
  }
  .scratch-cell .value{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho', serif; font-weight:700; font-size:20px; color:var(--ink);
  }
  .scratch-cell .value.small{ font-size:13px; }
  .scratch-cell canvas{ position:absolute; inset:0; width:100%; height:100%; cursor:pointer; touch-action:none; }
  .remaining-text{ color:rgba(26,16,8,0.6); font-size:11px; text-align:center; margin:16px 0 20px; }

  /* ---------- result screen ---------- */
  .result-row{ display:flex; align-items:center; padding:6px 4px; }
  .result-row.header{ font-weight:700; }
  .result-row.highlight{ background:var(--tan); }
  .r-col1{ width:44px; display:flex; align-items:center; gap:3px; font-size:13px; }
  .r-col2{ flex:1; font-size:13px; }
  .r-col3{ width:52px; text-align:center; font-size:13px; }
  .r-col4{ width:52px; text-align:right; font-size:13px; }
  .r-highlight{ color:var(--red); font-weight:700; }
  .row-divider{ border:none; border-top:0.5px solid rgba(26,16,8,0.3); margin:0; }

  /* ---------- toast / modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-box{
    background:var(--cream); border-radius:6px; padding:20px; max-width:340px; width:100%;
    border:1px solid var(--ink);
  }
  .modal-box h4{ margin:0 0 8px; font-size:15px; font-family:'Shippori Mincho', serif; }
  .modal-box p{ margin:0 0 16px; font-size:12px; color:#444; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:16px; }
  .modal-actions button{ background:none; border:none; font-size:13px; cursor:pointer; font-weight:700; }

  .finish-text{
    text-align:center; font-family:'Shippori Mincho', serif; font-weight:800; font-size:20px; color:var(--red);
    margin-bottom:14px;
  }
  ::-webkit-scrollbar{ width:0; height:0; }

  /* ---------- back (return) button ---------- */
  .back-btn{
    position:fixed;
    bottom:16px;
    left:max(12px, calc(50% - 240px + 12px));
    width:44px; height:44px; border-radius:50%;
    background:rgba(26,16,8,0.85); color:#F5F0E8; border:none;
    font-size:19px; cursor:pointer; z-index:50;
    box-shadow:0 3px 10px rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .back-btn:active{ transform:scale(0.92); }

  /* ---------- settings shortcut button ---------- */
  .settings-btn{
    position:fixed;
    bottom:16px;
    right:max(12px, calc(50% - 240px + 12px));
    width:44px; height:44px; border-radius:50%;
    background:rgba(139,26,26,0.88); color:#F5F0E8; border:none;
    font-size:19px; cursor:pointer; z-index:50;
    box-shadow:0 3px 10px rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .settings-btn:active{ transform:scale(0.92); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   カミケバ (WINNERS & PAYOUT) — Web port
   Ported from Android/Kotlin Jetpack Compose source
   ========================================================= */

/* ---------- utils ---------- */
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function hexLuminance(hex){
  if(!hex) return 0;
  const c = hex.replace('#','');
  const r = parseInt(c.substring(0,2),16)/255;
  const g = parseInt(c.substring(2,4),16)/255;
  const b = parseInt(c.substring(4,6),16)/255;
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function textColorFor(hex){ return hexLuminance(hex) > 0.55 ? '#000000' : '#F5F0E8'; }
function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

/* ---------- game logic (ported from GameModel.kt) ---------- */
function fullyRandomOdds(total, count){
  const result = new Array(count).fill(0);
  let remaining = total;
  const order = shuffle([...Array(count).keys()]);
  for(let i = 0; i < count - 1; i++){
    const give = randInt(0, remaining);
    result[order[i]] = give;
    remaining -= give;
  }
  result[order[count-1]] = Math.max(remaining, 0);
  return result;
}
function generateOdds(total, count, minGuaranteeProb, jackpotProb){
  if(count === 0) return [];
  const roll = randInt(1, 100);
  if(roll <= jackpotProb){
    const result = new Array(count).fill(0);
    result[randInt(0, count-1)] = total;
    return result;
  } else if(roll <= jackpotProb + minGuaranteeProb){
    if(total < count) return fullyRandomOdds(total, count);
    const result = new Array(count).fill(1);
    let remaining = total - count;
    const order = shuffle([...Array(count).keys()]);
    for(let i = 0; i < count - 1; i++){
      const give = randInt(0, remaining);
      result[order[i]] += give;
      remaining -= give;
    }
    result[order[count-1]] += Math.max(remaining, 0);
    return result;
  } else {
    return fullyRandomOdds(total, count);
  }
}
function generateRaceCard(settings){
  const n = settings.playerCount;
  const w = settings.winnerCount;
  const winnerNumbers = shuffle([...Array(n).keys()].map(i => i+1)).slice(0, w);
  const odds = generateOdds(n, w, settings.minGuaranteeProbability, settings.jackpotProbability);
  const cells = [];
  winnerNumbers.forEach((num, i) => {
    cells.push({ id: 'w_'+i+'_'+uid(), isWinner: true, rowIndex: i, hiddenValue: String(num), isScratched: false });
    const o = odds[i];
    cells.push({ id: 'o_'+i+'_'+uid(), isWinner: false, rowIndex: i, hiddenValue: o === 0 ? '0' : (o + '/' + n), isScratched: false });
  });
  return { cells, denominator: n };
}
function winnerCells(card){ return card.cells.filter(c => c.isWinner).sort((a,b) => a.rowIndex - b.rowIndex); }
function oddsCells(card){ return card.cells.filter(c => !c.isWinner).sort((a,b) => a.rowIndex - b.rowIndex); }
function allScratched(card){ return card.cells.every(c => c.isScratched); }

function calcResults(assignments, card, betPoints){
  const n = card.denominator;
  const wc = winnerCells(card), oc = oddsCells(card);
  const results = assignments.map(a => {
    const win = wc.find(c => c.hiddenValue === String(a.number));
    if(win){
      const oddsCell = oc.find(c => c.rowIndex === win.rowIndex);
      const oddsStr = oddsCell ? oddsCell.hiddenValue : '0';
      const numerator = oddsStr === '0' ? 0 : parseInt(oddsStr.split('/')[0], 10);
      return { playerName: a.playerName, number: a.number, isWinner: true, oddsNumerator: numerator, denominator: n, score: numerator * betPoints };
    }
    return { playerName: a.playerName, number: a.number, isWinner: false, oddsNumerator: 0, denominator: n, score: 0 };
  });
  results.sort((a,b) => b.score - a.score);
  return results;
}
function oddsDisplay(r){
  if(r.oddsNumerator === 0) return '0';
  return state.settings.oddsDisplayMode === 'fraction' ? (r.oddsNumerator + '/' + r.denominator) : String(r.oddsNumerator);
}
// スクラッチマスの配当セル用: hiddenValue("3/8" or "0")を設定に応じて整形
function displayOddsCellValue(hiddenValue){
  if(hiddenValue === '0') return '0';
  const numerator = hiddenValue.split('/')[0];
  return state.settings.oddsDisplayMode === 'fraction' ? hiddenValue : numerator;
}

function randomAssign(players, playerCount, allowDuplicate){
  if(players.length === 0) return [];
  const result = [];
  const numbers = shuffle([...Array(playerCount).keys()].map(i => i+1));
  const shuffledPlayers = shuffle(players);
  if(allowDuplicate){
    numbers.forEach(num => {
      const p = shuffledPlayers[randInt(0, shuffledPlayers.length - 1)];
      result.push({ playerId: p.id, playerName: p.name, number: num });
    });
  } else {
    numbers.forEach((num, i) => {
      const p = shuffledPlayers[i % shuffledPlayers.length];
      result.push({ playerId: p.id, playerName: p.name, number: num });
    });
  }
  return result;
}

/* ---------- 24 color palette (from NumberColorScreen.kt) ---------- */
const PALETTE_24 = [
  "#FF0000","#FF4500","#FF8C00","#FFA500",
  "#FFD700","#FFFF00","#ADFF2F","#00FF00",
  "#00FA9A","#00FFFF","#00BFFF","#1E90FF",
  "#0000FF","#8A2BE2","#FF00FF","#FF1493",
  "#FF69B4","#FFFFFF","#D3D3D3","#808080",
  "#404040","#000000","#8B4513","#A0522D"
];

/* ---------- state (mirrors GameState / GameViewModel, in-memory only) ---------- */
let state = {
  settings: {
    mode: 'FULL', playerCount: 8, winnerCount: 3, setCount: 10, roundsPerSet: 30,
    betPoints: 1, soundEnabled: true, minGuaranteeProbability: 80, jackpotProbability: 5,
    allowDuplicateNumbers: false, oddsDisplayMode: 'number' // 'number' = 数字のみ(デフォルト) / 'fraction' = 分数
  },
  savedPlayers: [],       // {id, name}
  activePlayerIds: [],
  assignments: [],        // {playerId, playerName, number}
  currentSet: 1,
  currentRound: 1,
  currentCard: null,
  history: [],             // RoundHistory
  scratchOnlyHistory: [],  // ScratchOnlyHistory
  numberColors: {},        // number -> hex
  isInProgress: false      // ゲーム進行中かどうか(設定画面の表示切替に使用)
};
let nextPlayerId = 1;
let screen = 'settings';
let navStack = []; // 「戻る」ボタン用の画面履歴

function goTo(newScreen){
  navStack.push(screen);
  screen = newScreen;
}
function goToRoot(newScreen){
  navStack = [];
  screen = newScreen;
}
function goBack(){
  if(navStack.length === 0) return;
  screen = navStack.pop();
  render();
}

function activePlayers(){ return state.savedPlayers.filter(p => state.activePlayerIds.includes(p.id)); }
function totalRounds(){ return state.settings.setCount * state.settings.roundsPerSet; }
function completedRounds(){ return state.history.length; }
function isGameFinished(){ return completedRounds() >= totalRounds(); }
function progressText(){ return state.currentSet + 'セット目　' + state.currentRound + '回戦'; }
function scratchProgress(){
  const done = state.scratchOnlyHistory.filter(h => h.setNumber === state.currentSet).length;
  return state.currentSet + 'セット目　' + done + '/' + state.settings.roundsPerSet + '枚';
}

function getTotalScores(){
  return activePlayers().map(p => {
    const total = state.history.reduce((sum, round) =>
      sum + round.results.filter(r => r.playerName === p.name).reduce((s,r) => s + r.score, 0), 0);
    return [p.name, total];
  }).sort((a,b) => b[1] - a[1]);
}
function getScratchStats(){
  const stats = {};
  state.scratchOnlyHistory.forEach(h => {
    h.winnerNumbers.forEach((num, i) => {
      const odds = h.oddsValues[i] || 0;
      stats[num] = (stats[num] || 0) + odds;
    });
  });
  return stats;
}
function getScratchWinCounts(){
  const counts = {};
  state.scratchOnlyHistory.forEach(h => {
    h.winnerNumbers.forEach(num => {
      counts[num] = (counts[num] || 0) + 1;
    });
  });
  return counts;
}

/* ---------- actions ---------- */
function addPlayerName(name){
  name = name.trim();
  if(!name) return;
  state.savedPlayers.push({ id: nextPlayerId++, name });
}
function removePlayerName(id){
  state.savedPlayers = state.savedPlayers.filter(p => p.id !== id);
  state.activePlayerIds = state.activePlayerIds.filter(pid => pid !== id);
}
function toggleActivePlayer(id){
  if(state.activePlayerIds.includes(id)) state.activePlayerIds = state.activePlayerIds.filter(pid => pid !== id);
  else state.activePlayerIds.push(id);
}
function assignNumberToPlayer(playerId, playerName, number){
  const allowDup = state.settings.allowDuplicateNumbers;
  let base = allowDup ? state.assignments : state.assignments.filter(a => a.number !== number);
  const already = base.some(a => a.playerId === playerId && a.number === number);
  if(!already) base = base.concat([{ playerId, playerName, number }]);
  state.assignments = base;
}
function unassignNumber(number){ state.assignments = state.assignments.filter(a => a.number !== number); }
function assignRandom(){ state.assignments = randomAssign(activePlayers(), state.settings.playerCount, state.settings.allowDuplicateNumbers); }
function startRound(){ state.currentCard = generateRaceCard(state.settings); }
function redoCurrentRound(){ state.currentCard = generateRaceCard(state.settings); }
function scratchCellById(cellId){
  if(!state.currentCard) return;
  state.currentCard.cells = state.currentCard.cells.map(c => c.id === cellId && !c.isScratched ? {...c, isScratched:true} : c);
}
function revealAllWinnerCells(){ if(!state.currentCard) return; state.currentCard.cells = state.currentCard.cells.map(c => c.isWinner ? {...c, isScratched:true} : c); }
function revealAllOddsCells(){ if(!state.currentCard) return; state.currentCard.cells = state.currentCard.cells.map(c => !c.isWinner ? {...c, isScratched:true} : c); }
function revealAllCells(){ if(!state.currentCard) return; state.currentCard.cells = state.currentCard.cells.map(c => ({...c, isScratched:true})); }

function completeRound(){
  const card = state.currentCard; if(!card) return;
  const results = calcResults(state.assignments, card, state.settings.betPoints);
  const wNums = winnerCells(card).map(c => parseInt(c.hiddenValue, 10));
  const oddsMap = {};
  winnerCells(card).forEach(wc => {
    const num = parseInt(wc.hiddenValue, 10);
    const oc = oddsCells(card).find(c => c.rowIndex === wc.rowIndex);
    const str = oc ? oc.hiddenValue : '0';
    oddsMap[num] = str === '0' ? 0 : parseInt(str.split('/')[0], 10);
  });
  state.history.push({ setNumber: state.currentSet, roundNumber: state.currentRound, winnerNumbers: wNums, oddsMap, denominator: state.settings.playerCount, results });
  const nextRound = state.currentRound + 1;
  if(nextRound > state.settings.roundsPerSet){ state.currentSet += 1; state.currentRound = 1; }
  else state.currentRound = nextRound;
  state.currentCard = null;
  state.assignments = [];
}
function completeScratchOnly(){
  const card = state.currentCard; if(!card) return;
  const wNums = winnerCells(card).map(c => parseInt(c.hiddenValue, 10));
  const oddsValues = oddsCells(card).map(c => c.hiddenValue === '0' ? 0 : parseInt(c.hiddenValue.split('/')[0], 10));
  const currentCount = state.scratchOnlyHistory.filter(h => h.setNumber === state.currentSet).length + 1;
  state.scratchOnlyHistory.push({ setNumber: state.currentSet, scratchNumber: currentCount, winnerNumbers: wNums, oddsValues, denominator: state.settings.playerCount });
  if(currentCount >= state.settings.roundsPerSet) state.currentSet += 1;
  state.currentCard = null;
}
function toggleSound(){ state.settings.soundEnabled = !state.settings.soundEnabled; }
function setNumberColor(num, hex){ state.numberColors[num] = hex; }
function resetNumberColor(num){ delete state.numberColors[num]; }
function resetAll(){
  const saved = state.savedPlayers, colors = state.numberColors, allowDup = state.settings.allowDuplicateNumbers, oddsMode = state.settings.oddsDisplayMode;
  state = {
    settings: { mode:'FULL', playerCount:8, winnerCount:3, setCount:10, roundsPerSet:30, betPoints:1, soundEnabled:true, minGuaranteeProbability:80, jackpotProbability:5, allowDuplicateNumbers: allowDup, oddsDisplayMode: oddsMode },
    savedPlayers: saved, activePlayerIds: [], assignments: [], currentSet:1, currentRound:1, currentCard:null,
    history: [], scratchOnlyHistory: [], numberColors: colors, isInProgress: false
  };
}

/* ---------- render helpers ---------- */
const app = document.getElementById('app');
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function h(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if(k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c => { if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function headerStamp(){
  return h('div', {class:'header-wrap'}, [
    h('div', {class:'header-title serif'}, ['WINNERS & PAYOUT']),
    h('hr', {class:'header-divider'})

}
function settingRow(label, value, min, max, unit, onMinus, onPlus, disabled){
  const row = h('div', {class:'setting-row' + (disabled?' row-disabled':''), style: disabled ? 'opacity:0.45;' : ''});
  row.appendChild(h('div', {class:'setting-label'}, [label]));
  const stepper = h('div', {class:'stepper'});
  const minusBtn = h('button', { onclick:()=>{ if(disabled) return; onMinus(); render(); } }, ['－']);
  if(disabled || value<=min) minusBtn.disabled = true;
  const plusBtn = h('button', { onclick:()=>{ if(disabled) return; onPlus(); render(); } }, ['＋']);
  if(disabled || value>=max) plusBtn.disabled = true;
  stepper.appendChild(minusBtn);
  stepper.appendChild(h('div', {class:'val'}, [value + ' ' + unit]));
  stepper.appendChild(plusBtn);
  row.appendChild(stepper);
  return row;
}
function toggleRow(label, sub, checked, onChange, disabled){
  const row = h('div', {class:'toggle-row', style: disabled ? 'opacity:0.45;' : ''});
  const left = h('div', {}, [h('div', {class:'setting-label'}, [label])]);
  if(sub) left.appendChild(h('div', {class:'sub'}, [sub]));
  row.appendChild(left);
  const right = h('div', {style:'display:flex;align-items:center;'});
  const labelSpan = h('span', {class:'switch-label', style: checked ? 'color:#8B1A1A' : 'color:#888'}, [checked ? 'ON' : 'OFF']);
  right.appendChild(labelSpan);
  const sw = h('label', {class:'switch'});
  const input = h('input', {type:'checkbox'});
  input.checked = checked;
  input.disabled = !!disabled;
  input.addEventListener('change', () => { if(disabled) return; onChange(input.checked); render(); });
  sw.appendChild(input);
  sw.appendChild(h('span', {class:'track'}));

/* ---------- scratch cell (canvas scratch effect) ---------- */
function buildScratchCell(cell){
  const wrap = h('div', {class:'scratch-cell'});
  const displayText = cell.isWinner ? cell.hiddenValue : displayOddsCellValue(cell.hiddenValue);
  const isSmallText = displayText.includes('/');
  wrap.appendChild(h('div', {class:'value' + (isSmallText?' small':'')}, [displayText]));
  if(cell.isScratched) return wrap;

  const canvas = document.createElement('canvas');
  wrap.appendChild(canvas);

  let ctx, revealed = false, points = 0, dragging = false, clickCount = 0, clickTimer = null;

  function setupCanvas(){
    const rect = wrap.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(rect.width));
    canvas.height = Math.max(1, Math.round(rect.height));
    ctx = canvas.getContext('2d');
    ctx.fillStyle = '#9E9E9E';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(setupCanvas);

  function reveal(){
    if(revealed) return;
    revealed = true;
    canvas.style.transition = 'opacity .18s ease';
    canvas.style.opacity = '0';
    setTimeout(() => canvas.remove(), 180);
    scratchCellById(cell.id);
    checkAllScratchedAndUpdateFooter();
  }
  function scratchAt(x, y){
    if(!ctx) return;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, 13, 0, Math.PI*2);
    ctx.fill();
    points++;
    if(points > 16) reveal();
  }
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return [cx, cy];
  }
  canvas.addEventListener('pointerdown', (e) => {
    if(revealed) return;
    dragging = true;
    const [x,y] = getPos(e);
    scratchAt(x, y);
  });
  canvas.addEventListener('pointermove', (e) => {
    if(revealed || !dragging) return;
    const [x,y] = getPos(e);
    scratchAt(x, y);
  });
  window.addEventListener('pointerup', () => {
    if(!dragging) return;
    dragging = false;
    if(points <= 1){
      clickCount++;
      if(clickTimer) clearTimeout(clickTimer);
      if(clickCount >= 2) reveal();
      else clickTimer = setTimeout(() => { clickCount = 0; }, 500);
    }
  });
  return wrap;
}
function checkAllScratchedAndUpdateFooter(){
  const footer = document.getElementById('race-footer');
  if(!footer || !state.currentCard) return;
  const remaining = state.currentCard.cells.filter(c => !c.isScratched).length;
  footer.innerHTML = '';
  const isScratchMode = state.settings.mode === 'SCRATCH';
  if(remaining > 0){
    footer.appendChild(h('div', {class:'remaining-text'}, ['残り ' + remaining + ' マス　タップまたはスワイプで削れます']));
  } else {
    const btn = h('button', {class:'btn btn-ink', style:'margin:0 20px; width:calc(100% - 40px);', onclick: () => {
      if(isScratchMode) completeScratchOnly(); else completeRound();
      goTo(isScratchMode ? 'scratchResult' : 'result');
      render();
    }}, ['結果発表 →']);
    const box = h('div', {style:'padding:0 0 18px;'});
    box.appendChild(btn);
    footer.appendChild(box);
  }
}

    '参加者は設定した「参加人数」まで選べます。2人以上選択すれば次へ進めます。'
  ]));

  c.appendChild(h('div', {style:'font-size:12px;'}, ['タップして参加者を選択（' + state.activePlayerIds.length + '/' + state.settings.playerCount + '人）']));

  const inputRow = h('div', {class:'input-row'});
  const input = h('input', {type:'text', placeholder:'新しい名前'});
  inputRow.appendChild(input);
  const addBtn = h('button', {class:'icon-btn', onclick: () => { addPlayerName(input.value); render(); }}, ['＋']);
  input.addEventListener('keydown', (e) => { if(e.key==='Enter'){ addPlayerName(input.value); render(); } });
  inputRow.appendChild(addBtn);
  c.appendChild(inputRow);

  if(state._playerError){
    c.appendChild(h('div', {class:'error-text'}, [state._playerError]));
  }

  const grid = h('div', {class:'player-grid'});
  state.savedPlayers.forEach(p => {
    const isSel = state.activePlayerIds.includes(p.id);
    const card = h('div', {class:'player-card' + (isSel?' selected':''), onclick: () => { toggleActivePlayer(p.id); render(); }});
    card.appendChild(h('span', {class:'name'}, [p.name]));
    const delBtn = h('button', {onclick: (e) => { e.stopPropagation(); removePlayerName(p.id); render(); }}, ['✕']);
    card.appendChild(delBtn);
    grid.appendChild(card);
  });
  c.appendChild(grid);

  c.appendChild(h('div', {style:'height:16px;'}));
  c.appendChild(h('button', {class:'btn btn-ink serif', onclick: () => {
    if(state.activePlayerIds.length < 2){ state._playerError = '2人以上選んでください'; }
    else { state._playerError = ''; goTo('assign'); }
    render();
  }}, ['番号割当へ →']));
  return c;
}

function renderAssign(){
  const c = h('div', {class:'screen'});
  const players = activePlayers();
  const n = state.settings.playerCount;
  state._selectedPlayerId = state._selectedPlayerId ?? null;

  c.appendChild(headerStamp());
  c.appendChild(h('div', {class:'screen-title serif'}, ['番号札の割当']));
  c.appendChild(h('hr', {class:'thin-divider'}));

  c.appendChild(h('button', {class:'btn btn-green', style:'height:44px;margin-bottom:16px;', onclick: () => { assignRandom(); render(); }}, ['🎲 ランダムで割当']));

  c.appendChild(h('div', {style:'font-size:13px;font-weight:700;margin-bottom:6px;'}, ['① 名前を選択（1人で複数枚OK）']));
  c.appendChild(h('div', {class:'info-box', style:'margin-bottom:10px;'}, [
    '名前をタップすると赤色＝選択中になります。その状態で下の②の番号をタップすると、この人に番号が割り当てられます。\n' +
    '割り当てが完了した名前は黒色＝割当済みに変わり、名前の横の（　）内に持っている番号が表示されます。\n' +
    '割当済み（黒色）の名前も再度タップすれば選択中（赤色）に戻り、番号を追加で割り当てられます。\n' +
    '灰色のままの名前はまだ何も割り当てられていません。'
  ]));
  const legend = h('div', {style:'display:flex;gap:14px;margin-bottom:10px;font-size:11px;'});
  legend.appendChild(h('div', {style:'display:flex;align-items:center;gap:4px;'}, [
    h('span', {style:'width:12px;height:12px;border-radius:20px;background:var(--tan);border:1px solid var(--ink);display:inline-block;'}), '未割当'
  ]));
  legend.appendChild(h('div', {style:'display:flex;align-items:center;gap:4px;'}, [
    h('span', {style:'width:12px;height:12px;border-radius:20px;background:var(--red);display:inline-block;'}), '選択中'
  ]));
  legend.appendChild(h('div', {style:'display:flex;align-items:center;gap:4px;'}, [
    h('span', {style:'width:12px;height:12px;border-radius:20px;background:var(--ink);display:inline-block;'}), '割当済み'
  ]));
  c.appendChild(legend);
  const chipRow = h('div', {class:'flow-row'});
  players.forEach(p => {
    const myNumbers = state.assignments.filter(a => a.playerId === p.id).map(a => a.number).sort((a,b)=>a-b);
    const isSelected = state._selectedPlayerId === p.id;
    const label = myNumbers.length ? p.name + ' (' + myNumbers.join(',') + ')' : p.name;
    const cls = isSelected ? 'chip selected' : (myNumbers.length ? 'chip filled' : 'chip');
    chipRow.appendChild(h('div', {class:cls, onclick: () => { state._selectedPlayerId = isSelected ? null : p.id; render(); }}, [label]));
  });
  c.appendChild(chipRow);
  if(state._selectedPlayerId !== null){
    c.appendChild(h('div', {style:'font-size:11px;color:#8B1A1A;margin-top:6px;'}, ['↓ 番号をタップして追加（複数選べます）']));
  }

  c.appendChild(h('div', {style:'height:20px;'}));
  c.appendChild(h('div', {style:'font-size:13px;font-weight:700;margin-bottom:6px;'}, ['② 番号を選択']));
  const numRow = h('div', {class:'flow-row'});
  for(let num=1; num<=n; num++){
    const takenBy = state.assignments.filter(a => a.number === num);
    const isTaken = takenBy.length > 0 && !state.settings.allowDuplicateNumbers;
    const hex = state.numberColors[num];
    const baseColor = hex || '#1A1008';
    const displayColor = isTaken ? '#9e9e9e' : baseColor;
    const enabled = state._selectedPlayerId !== null && (!isTaken || state.settings.allowDuplicateNumbers);
    const circle = h('button', {class:'num-circle' + (enabled?'':' disabled'), style:'background:'+displayColor+';color:'+textColorFor(displayColor)+';',
      onclick: () => {
        if(!enabled) return;
        const pid = state._selectedPlayerId;
        const player = players.find(p => p.id === pid);
        if(!player) return;
        assignNumberToPlayer(pid, player.name, num);
        render();
      }}, [String(num)]);
    numRow.appendChild(circle);
  }
  c.appendChild(numRow);

  c.appendChild(h('div', {style:'height:20px;'}));
  c.appendChild(h('div', {style:'font-size:13px;font-weight:700;margin-bottom:6px;'}, ['現在の割当（' + state.assignments.length + '/' + n + '）']));
  state.assignments.slice().sort((a,b)=>a.number-b.number).forEach(a => {
    const hex = state.numberColors[a.number];
    const row = h('div', {class:'assign-item'});
    const left = h('div', {class:'left'});
    if(hex) left.appendChild(h('span', {class:'dot', style:'background:'+hex}));
    left.appendChild(document.createTextNode(a.number + '番　' + a.playerName));
    row.appendChild(left);
    row.appendChild(h('button', {onclick: () => { unassignNumber(a.number); render(); }}, ['解除']));
    c.appendChild(row);
  });

  c.appendChild(h('div', {style:'height:20px;'}));
  const startBtn = h('button', {class:'btn btn-ink serif', onclick: () => { startRound(); state.isInProgress = true; goTo('race'); render(); }}, ['レース開始！ →']);
  if(state.assignments.length !== n) startBtn.disabled = true;
  c.appendChild(startBtn);
  return c;
}

function renderRace(){
  const c = h('div', {class:'screen'});
  const card = state.currentCard;
  const isScratchMode = state.settings.mode === 'SCRATCH';

  const topbar = h('div', {class:'race-topbar'});
  topbar.appendChild(h('div', {}, [isScratchMode ? scratchProgress() : progressText()]));
  const right = h('div', {class:'right'});
  right.appendChild(h('span', {style:'cursor:pointer;', onclick: () => { toggleSound(); render(); }}, [state.settings.soundEnabled ? '🔊' : '🔇']));
  if(!isScratchMode){
    right.appendChild(h('span', {class:'count'}, [completedRounds() + '/' + totalRounds()]));
  }
  right.appendChild(h('span', {style:'cursor:pointer;opacity:.6;font-size:14px;', onclick: () => {
    showModal('やり直しますか？', 'カウントを進めず新しいカードを表示します。', 'やり直す', () => { redoCurrentRound(); });
  }}, ['↺']));
  topbar.appendChild(right);
  c.appendChild(topbar);

  const revealRow = h('div', {class:'reveal-row'});
  revealRow.appendChild(h('button', {class:'btn-small', style:'background:rgba(26,16,8,0.75);color:#F5F0E8;flex:1;', onclick: () => { revealAllWinnerCells(); render(); }}, ['勝者一発']));
  revealRow.appendChild(h('button', {class:'btn-small', style:'background:rgba(139,26,26,0.85);color:#F5F0E8;flex:1;', onclick: () => { revealAllCells(); render(); }}, ['両方一発']));
  revealRow.appendChild(h('button', {class:'btn-small', style:'background:rgba(26,16,8,0.75);color:#F5F0E8;flex:1;', onclick: () => { revealAllOddsCells(); render(); }}, ['配当一発']));
  c.appendChild(revealRow);

  if(card){
    if(!isScratchMode && state.assignments.length){
      const strip = h('div', {class:'assign-strip'});
      state.assignments.slice().sort((a,b)=>a.number-b.number).forEach(a => {
        const hex = state.numberColors[a.number] || '#1A1008';
        const item = h('div', {class:'item'});
        item.appendChild(h('div', {class:'box', style:'background:'+hex+';color:'+textColorFor(hex)+';'}, [String(a.number)]));
        item.appendChild(h('div', {class:'pname'}, [a.playerName.slice(0,3)]));
        strip.appendChild(item);
      });
      c.appendChild(strip);
    }

    const cols = h('div', {class:'race-columns'});
    const wCol = h('div', {class:'race-col'});
    wCol.appendChild(h('h3', {class:'serif'}, ['勝　者']));
    const wCells = h('div', {class:'cells'});
    winnerCells(card).forEach(cell => wCells.appendChild(buildScratchCell(cell)));
    wCol.appendChild(wCells);
    cols.appendChild(wCol);

    const oCol = h('div', {class:'race-col'});
    oCol.appendChild(h('h3', {class:'serif'}, ['配　当']));
    const oCells = h('div', {class:'cells'});
    oddsCells(card).forEach(cell => oCells.appendChild(buildScratchCell(cell)));
    oCol.appendChild(oCells);
    cols.appendChild(oCol);

    c.appendChild(cols);

    const footer = h('div', {id:'race-footer'});
    const remaining = card.cells.filter(cc => !cc.isScratched).length;
    if(remaining > 0){
      footer.appendChild(h('div', {class:'remaining-text'}, ['残り ' + remaining + ' マス　タップまたはスワイプで削れます']));
    } else {
      const box = h('div', {style:'padding:16px 0 18px;'});
      box.appendChild(h('button', {class:'btn btn-ink serif', onclick: () => {
        if(isScratchMode) completeScratchOnly(); else completeRound();
        goTo(isScratchMode ? 'scratchResult' : 'result');
        render();
      }}, ['結果発表 →']));
      footer.appendChild(box);
    }
    c.appendChild(footer);
  }
  return c;
}

function renderResult(){
  const c = h('div', {class:'screen'});
  const last = state.history[state.history.length - 1];
  if(!last) return c;
  const totalScores = getTotalScores();

  c.appendChild(headerStamp());
  c.appendChild(h('div', {style:'text-align:center;font-size:15px;font-weight:700;'+''}, []));
  const title = h('div', {class:'serif', style:'text-align:center;font-size:15px;font-weight:700;margin-bottom:4px;'}, [last.setNumber + 'セット目　' + last.roundNumber + '回戦　結果']);
  c.appendChild(title);
  c.appendChild(h('hr', {class:'thin-divider'}));

  c.appendChild(h('div', {class:'info-box'}, [
    '賭け点数：' + state.settings.betPoints + '点　分母：' + last.denominator + '\n' +
    '当選番号：' + last.winnerNumbers.join('、') + '番'
  ]));

  c.appendChild(h('div', {class:'screen-title serif', style:'font-size:14px;margin-top:10px;'}, ['今回の結果']));
  c.appendChild(resultRow('番号','名前','配当','獲得点', {header:true}));
  c.appendChild(h('hr', {class:'thin-divider'}));
  last.results.forEach(r => {
    const dot = state.numberColors[r.number];
    c.appendChild(resultRow(
      (r.isWinner ? '★' : '') + r.number, r.playerName, oddsDisplay(r),
      r.isWinner ? (r.score + '点') : '―',
      { highlight: r.score > 0, dotColor: dot }
    ));
    c.appendChild(h('hr', {class:'row-divider'}));
  });

  if(state.history.length > 1){
    c.appendChild(h('div', {style:'height:10px;'}));
    c.appendChild(h('div', {class:'screen-title serif', style:'font-size:14px;'}, ['累計ランキング']));
    c.appendChild(resultRow('順位','名前','','累計点', {header:true}));
    c.appendChild(h('hr', {class:'thin-divider'}));
    totalScores.forEach((entry, i) => {
      c.appendChild(resultRow((i+1)+'位', entry[0], '', entry[1]+'点', {highlight: i===0}));
      c.appendChild(h('hr', {class:'row-divider'}));
    });
  }

  c.appendChild(h('div', {style:'height:20px;'}));
  if(isGameFinished()){
    c.appendChild(h('div', {class:'finish-text serif'}, ['全回戦終了！']));
    c.appendChild(h('button', {class:'btn btn-ink serif', onclick: () => { resetAll(); goToRoot('settings'); render(); }}, ['最初から']));
  } else {
    c.appendChild(h('button', {class:'btn btn-ink serif', onclick: () => { goTo('assign'); render(); }}, ['次の回戦へ →']));
  }
  return c;
}

function renderScratchResult(){
  const c = h('div', {class:'screen'});
  const last = state.scratchOnlyHistory[state.scratchOnlyHistory.length - 1];
  if(!last) return c;
  const stats = getScratchStats();
  const winCounts = getScratchWinCounts();
  const currentSetCount = state.scratchOnlyHistory.filter(h2 => h2.setNumber === last.setNumber).length;
  const isSetComplete = currentSetCount >= state.settings.roundsPerSet;

  c.appendChild(headerStamp());
  c.appendChild(h('div', {class:'serif', style:'text-align:center;font-size:15px;font-weight:700;margin-bottom:4px;'}, [last.setNumber + 'セット目　' + last.scratchNumber + '枚目　結果']));
  c.appendChild(h('hr', {class:'thin-divider'}));

  c.appendChild(h('div', {class:'screen-title serif', style:'font-size:14px;'}, ['今回の結果']));
  last.winnerNumbers.forEach((num, i) => {
    const odds = last.oddsValues[i] || 0;
    const dot = state.numberColors[num];
    const row = h('div', {class:'assign-item'});
    const left = h('div', {class:'left'});
    if(dot) left.appendChild(h('span', {class:'dot', style:'background:'+dot}));
    left.appendChild(h('span', {style:'font-weight:700;color:#8B1A1A;'}, ['当選 ' + num + '番']));
    row.appendChild(left);
    row.appendChild(h('span', {style:'font-size:14px;'}, [odds===0?'0':displayOddsCellValue(odds+'/'+last.denominator)]));
    c.appendChild(row);
  });

  c.appendChild(h('div', {style:'height:14px;'}));
  c.appendChild(h('div', {class:'screen-title serif', style:'font-size:13px;'}, ['履歴・統計（' + state.scratchOnlyHistory.length + '枚目まで）']));
  c.appendChild(h('div', {style:'font-size:12px;margin-bottom:8px;'}, ['現在：' + last.setNumber + 'セット目　' + currentSetCount + '/' + state.settings.roundsPerSet + '枚完了']));

  const statBox = h('div', {class:'info-box'});
  statBox.appendChild(h('div', {style:'font-weight:700;font-size:12px;margin-bottom:2px;'}, ['番号別 累計配当合計 ／ 当選回数']));
  statBox.appendChild(h('div', {style:'font-size:10px;color:#777;margin-bottom:6px;'}, ['上段＝配当合計（赤）　下段＝当選回数（黒・回）']));
  const nums = [...Array(last.denominator).keys()].map(i => i+1);
  for(let i=0; i<nums.length; i+=4){
    const row = h('div', {style:'display:flex;justify-content:space-evenly;margin-bottom:6px;'});
    nums.slice(i, i+4).forEach(num => {
      const dot = state.numberColors[num];
      const col = h('div', {style:'flex:1;text-align:center;'});
      const label = h('div', {style:'display:flex;align-items:center;justify-content:center;gap:2px;'});
      if(dot) label.appendChild(h('span', {style:'width:6px;height:6px;border-radius:50%;background:'+dot+';display:inline-block;'}));
      label.appendChild(h('span', {style:'font-size:10px;font-weight:700;'}, [String(num)]));
      col.appendChild(label);
      col.appendChild(h('div', {style:'font-size:12px;color:#8B1A1A;font-weight:800;'}, [String(stats[num] || 0)]));
      col.appendChild(h('div', {style:'font-size:10px;color:#1A1008;font-weight:700;'}, [(winCounts[num] || 0) + '回']));
      row.appendChild(col);
    });
    statBox.appendChild(row);
  }
  c.appendChild(statBox);

  c.appendChild(h('div', {style:'height:20px;'}));
  if(isSetComplete && state.currentSet > state.settings.setCount){
    c.appendChild(h('div', {class:'finish-text serif'}, ['全セット終了！']));
    c.appendChild(h('button', {class:'btn btn-ink serif', onclick: () => { resetAll(); goToRoot('settings'); render(); }}, ['最初から']));
  } else {
    c.appendChild(h('button', {class:'btn btn-ink serif', onclick: () => { startRound(); goTo('race'); render(); }}, ['次のスクラッチへ →']));
  }
  return c;
}

/* ---------- root render ---------- */
function render(){
  app.innerHTML = '';
  let node;
  switch(screen){
    case 'settings': node = renderSettings(); break;
    case 'colorSetting': node = renderColorSetting(); break;
    case 'playerSelect': node = renderPlayerSelect(); break;
    case 'assign': node = renderAssign(); break;
    case 'race': node = renderRace(); break;
    case 'result': node = renderResult(); break;
    case 'scratchResult': node = renderScratchResult(); break;
    default: node = renderSettings();
  }
  app.appendChild(node);

  if(navStack.length > 0){
    app.appendChild(h('button', {class:'back-btn', title:'一つ前の画面へ戻る', onclick: goBack}, ['←']));
  }
  if(screen !== 'settings'){
    app.appendChild(h('button', {class:'settings-btn', title:'設定を確認する（進行状況は保持されます）', onclick: () => { goTo('settings'); render(); }}, ['⚙']));
  }
}

render();
</script>
</body>
</html>
